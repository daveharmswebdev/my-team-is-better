name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cfb-engine:
    name: cfb-engine (pytest, mypy --strict, import-linter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cfb-engine
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.11"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: pytest
        run: uv run pytest -q

      - name: mypy --strict (contracts.py)
        run: uv run mypy --strict src/cfb_strength/contracts.py

      - name: import-linter
        run: uv run lint-imports

  apps-api:
    name: apps/api (pytest, mypy --strict, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.11"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: pytest
        run: uv run pytest -q

      - name: mypy --strict
        run: uv run mypy --strict src/api tests

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  apps-web:
    name: apps-web (eslint, tsc, vitest, dependency-cruiser, storybook build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: dependency-cruiser
        run: npm run dep-cruise

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  e2e:
    name: e2e (Playwright, apps/api + apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.11"

      - name: Set up Python
        working-directory: apps/api
        run: uv python install

      - name: Install apps/api dependencies
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install apps/web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # `apps/web/playwright.config.ts`'s `webServer` array boots both the
      # real FastAPI app (issue #39's `APP_TEST_MODE=1` seam, pointed at the
      # committed sqlite fixture db -- no live Postgres, no real
      # `ANTHROPIC_API_KEY`) and a `vite preview` of the production build,
      # and waits for both before running specs -- nothing further to start
      # or wait on here.
      - name: Playwright e2e suite
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Every job above should be listed as a required check if/when branch
  # protection on main becomes GitHub-enforced rather than process-only
  # (see CLAUDE.md "main is protected"). The new `e2e` job is deliberately
  # NOT treated as blocking yet even in the process-only sense (issue #39's
  # explicit v1 scope: land it green and stable for a while first) -- revisit
  # once it's proven stable in practice.
