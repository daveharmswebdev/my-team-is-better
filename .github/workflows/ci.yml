name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cfb-engine:
    name: cfb-engine (pytest, mypy --strict, import-linter, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cfb-engine
    steps:
      - uses: actions/checkout@v7

      # Issue #169: setup-uv publishes no bare major tag past v7 (v8-v10 exist
      # only as full releases), so this pins the release; v10.1.0 declares
      # the node24 runtime. The other actions use their node24 major tags.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.11"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: pytest
        run: uv run pytest -q

      # Was `contracts.py` alone, which meant the modules *implementing* that
      # contract were never type-checked -- `RatingMethod` /
      # `CareerRatingMethod` conformance is only machine-checked if the
      # implementations are checked too. Widened alongside the Elo engine.
      #
      # Scoped to the whole package rather than just `ratings/`: verified
      # clean at 32 source files (colocated `test_*.py` included), so this
      # gates nothing retroactively and there is no reason to leave the other
      # modules uncovered. CLAUDE.md's standing rule is `mypy --strict` on
      # anything crossing a module boundary, which in this package is most of
      # it. If a future change makes one module genuinely un-annotatable,
      # narrow it with a `[[tool.mypy.overrides]]` entry rather than shrinking
      # this path back and silently dropping everything else.
      #
      # The fixture generator (issue #110) is included explicitly. It patches
      # private `_fetch_*` names in the ingest clients to forbid live calls,
      # and a rename there would silently turn the stub into a no-op. mypy
      # --strict reports `Module has no attribute ...` for that, but only if
      # the generator is type-checked.
      - name: mypy --strict (whole package + fixture generator)
        run: uv run mypy --strict src/cfb_strength tests/fixtures/build_regression_fixtures.py

      - name: import-linter
        run: uv run lint-imports

      # Issue #141: the engine had no lint or format gate, so an unused
      # import (PR #140) landed with every check green. Same ruff config as
      # apps/api (packages/cfb-engine/pyproject.toml).
      - name: ruff check + format --check
        run: |
          uv run ruff check .
          uv run ruff format --check .

  apps-api:
    name: apps/api (pytest, mypy --strict, ruff, import-linter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.11"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: pytest
        run: uv run pytest -q

      # Architecture Brief §8's persona smoke eval (issue #109): the seven
      # golden years through the real persona pipeline and a real Claude call.
      # It runs as its own step so its status is visible on every PR.
      #
      # NAMED GAP (founder decision 2026-09-13; superseded 2026-09-14 by #203,
      # which runs it on persona-path PRs plus nightly, not built yet): this repo holds no
      # ANTHROPIC_API_KEY Actions secret, so in CI the eval is SKIPPED, and
      # `-rs` prints the reason. It is enforced only when run locally with a
      # key. If a secret is ever added, pass it to this step via `env:` and
      # the same command becomes a real gate. The step can't pass by accident:
      # pytest exits 4 if the eval file is deleted or renamed, and 5 if it
      # collects no tests. The eval's check functions themselves are unit
      # tested offline in the ordinary pytest step above.
      - name: persona smoke eval (skipped in CI - no API key secret, see #203)
        run: uv run pytest -q -rs tests/test_persona_smoke_eval.py

      - name: mypy --strict
        run: uv run mypy --strict src/api tests

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # The engine-layering rule from ARCHITECTURE §2 (issue #54). `apps/api`
      # has its own `.importlinter`, separate from `packages/cfb-engine`'s --
      # it declares `root_packages = api, cfb_strength` so a forbidden
      # contract can name engine submodules across the package boundary,
      # which the Architecture Brief previously (wrongly) said was impossible.
      - name: import-linter (engine layering rule)
        run: uv run lint-imports

  apps-web:
    name: apps-web (eslint, tsc, vitest, dependency-cruiser, storybook build + a11y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Issue #116: Prettier is a stated standard (CLAUDE.md) with a local
      # pre-commit hook (#55), but a hook is bypassable and never runs on a
      # PR, so this is the only gate that keeps `main` formatted. Uses the
      # package script rather than a re-spelled `npx prettier --check .` so
      # the CI and pre-commit halves can't drift apart.
      - name: Prettier
        run: npm run format:check

      - name: Type-check
        run: npx tsc -b

      - name: dependency-cruiser
        run: npm run dep-cruise

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # Issue #90: `build-storybook` never runs a11y checks, so
      # `.storybook/preview.tsx`'s `a11y.test: 'error'` is only enforced by
      # this step -- every story runs in headless Chromium through
      # @storybook/addon-vitest, and an axe violation (or a broken play
      # function) fails the job. The browser install must precede it; the
      # jsdom `npm run test` step above needs no browser.
      - name: Install Playwright Chromium (storybook tests)
        run: npx playwright install --with-deps chromium

      - name: Storybook tests (a11y enforced)
        run: npm run test-storybook

  # The coordinator/spoke process itself (CLAUDE.md): the hooks in .claude/hooks/
  # enforce the ownership map, main protection and the delegation contract, so
  # they get the same gates as product code. They run as standalone
  # `uv run --script` files outside the uv workspace, so tools are pinned with
  # --with (versions match uv.lock) instead of a lockfile.
  claude-process:
    name: "claude-process (hooks + delegation contract: pytest, mypy --strict, ruff, conflict markers)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.11"

      - name: pytest
        run: uv run --no-project --python 3.12 --with pytest==9.1.1 --with jsonschema==4.26.0 pytest -q .claude/hooks/tests

      - name: mypy --strict
        env:
          MYPYPATH: .claude/hooks
        run: uv run --no-project --python 3.12 --with mypy==2.3.1 --with pytest==9.1.1 --with jsonschema==4.26.0 --with types-jsonschema==4.26.0.20260518 mypy --strict --explicit-package-bases .claude/hooks

      - name: ruff check + format --check
        run: |
          uv run --no-project --with ruff==0.16.6 ruff check .claude/hooks
          uv run --no-project --with ruff==0.16.6 ruff format --check .claude/hooks

      # #118 landed a rebase commit with raw conflict markers, and nothing
      # noticed. Markers at the start of a line never belong in a tracked file.
      - name: no merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)'; then
            echo "Merge-conflict markers found above."
            exit 1
          fi

  e2e:
    name: e2e (Playwright, apps/api + apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.11"

      - name: Set up Python
        working-directory: apps/api
        run: uv python install

      - name: Install apps/api dependencies
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install apps/web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # `apps/web/playwright.config.ts`'s `webServer` array boots both the
      # real FastAPI app (issue #39's `APP_TEST_MODE=1` seam, pointed at the
      # committed sqlite fixture db -- no live Postgres, no real
      # `ANTHROPIC_API_KEY`) and a `vite preview` of the production build,
      # and waits for both before running specs -- nothing further to start
      # or wait on here.
      - name: Playwright e2e suite
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Every job above, `e2e` included, is a required check in main's ruleset
  # (.github/rulesets/main.json). Adding, renaming or removing a job means updating
  # that file and applying it (CLAUDE.md); test_ruleset.py fails until they match.
  # `e2e` became blocking on 2026-09-14 (founder decision). Playwright retries a failed
  # spec twice in CI, which hides flakes (#197); broader coverage is #204.
