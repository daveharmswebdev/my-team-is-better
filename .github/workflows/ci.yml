name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cfb-engine:
    name: cfb-engine (pytest, mypy --strict, import-linter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cfb-engine
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.11"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: pytest
        run: uv run pytest -q

      - name: mypy --strict (contracts.py)
        run: uv run mypy --strict src/cfb_strength/contracts.py

      - name: import-linter
        run: uv run lint-imports

  apps-api:
    name: apps/api (pytest, mypy --strict, ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.11"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: pytest
        run: uv run pytest -q

      - name: mypy --strict
        run: uv run mypy --strict src/api tests

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  apps-web:
    name: apps-web (eslint, tsc, vitest, dependency-cruiser, storybook build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: dependency-cruiser
        run: npm run dep-cruise

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  # Every job above should be listed as a required check if/when branch
  # protection on main becomes GitHub-enforced rather than process-only
  # (see CLAUDE.md "main is protected").
