[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for My Team Is Better -- HTTP endpoints + persona orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cfb-strength-orchestrated",
    "anthropic>=1.5.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"

[tool.uv.sources]
cfb-strength-orchestrated = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[tool.mypy]
strict = true

# There is deliberately NO `ignore_missing_imports` override for
# `cfb_strength.*` here (issue #102). packages/cfb-engine now ships a
# `py.typed` marker, so every `from cfb_strength... import ...` in this app
# is checked against the engine's real signatures instead of being widened
# to `Any`. That is what makes a typo'd keyword at the `get_conn` seam
# (issue #44) or a typo'd attribute on a `contracts.py` exception fail CI
# rather than production. Re-adding such an override would silently restore
# that blind spot -- if a future engine symbol genuinely can't be typed,
# narrow it to that symbol and say why.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
