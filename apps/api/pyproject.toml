[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for My Team Is Better -- HTTP endpoints + persona orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cfb-strength-orchestrated",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"

[tool.uv.sources]
cfb-strength-orchestrated = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
