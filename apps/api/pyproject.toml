[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for My Team Is Better -- HTTP endpoints + persona orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "cfb-strength-orchestrated",
    "anthropic>=1.5.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"

[tool.uv.sources]
cfb-strength-orchestrated = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[tool.mypy]
strict = true

# packages/cfb-engine ships no py.typed marker (coordinator-owned, apps/api
# may not edit it -- see CLAUDE.md's layering rule). Without this override,
# every static `from cfb_strength... import ...` in this app trips
# mypy's [import-untyped] under --strict. The functions/dataclasses this app
# actually imports (cfb_strength.contracts, .config, .db.connection,
# .evidence.proof) are read-only, signature-stable per the Architecture
# Brief's contract -- this override widens their imported types to `Any`,
# it does not relax --strict for any of this app's own code.
[[tool.mypy.overrides]]
module = "cfb_strength.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
