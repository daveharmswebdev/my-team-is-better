[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for My Team Is Better -- HTTP endpoints + persona orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # >=0.137.2: tests/test_openapi_error_responses.py walks routes with
    # `fastapi.routing.iter_route_contexts`/`RouteContext`, first shipped there.
    "fastapi>=0.137.2",
    "uvicorn[standard]>=0.30.0",
    "cfb-strength-orchestrated",
    "anthropic>=1.5.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"

[tool.uv.sources]
cfb-strength-orchestrated = { workspace = true }

[tool.pytest.ini_options]
# Issue #110: the same gate as packages/cfb-engine. `ensure_schema` migrating
# a db that already holds games means the db is stale (#97), so the warning is
# an error for the whole suite. `tests/fixtures/cfb_verdict_fixture.sqlite3`
# comes from `tests/fixtures/build_fixture.py`, and the throwaway dbs in
# `sport_fixture.py` / `team_catalog_fixture.py` are built fresh, so none of
# them should ever trip it. Never ignore it here; a test that migrates a stale
# db on purpose must ignore it narrowly, on that test.
filterwarnings = ["error::cfb_strength.db.connection.StaleDatabaseWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
    # Enforces this app's engine-layering rule (`.importlinter`, issue #54).
    # `packages/cfb-engine` already dev-depends on import-linter for its own
    # `.importlinter`, but that is a different environment -- `lint-imports`
    # has to be runnable from `apps/api` to see this app's import graph.
    "import-linter>=2.0",
    # tests/test_openapi_error_responses.py (issue #111) validates real
    # error responses against the schemas /openapi.json publishes. Declared
    # here rather than borrowed as a transitive dependency (see #120).
    # jsonschema ships no `py.typed`, so its stubs are needed for mypy --strict.
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.mypy]
strict = true

# There is deliberately NO `ignore_missing_imports` override for
# `cfb_strength.*` here (issue #102). packages/cfb-engine now ships a
# `py.typed` marker, so every `from cfb_strength... import ...` in this app
# is checked against the engine's real signatures instead of being widened
# to `Any`. That is what makes a typo'd keyword at the `get_conn` seam
# (issue #44) or a typo'd attribute on a `contracts.py` exception fail CI
# rather than production. ANY `[[tool.mypy.overrides]]` entry for
# `cfb_strength.*` that stops mypy reading the engine's types silently
# restores that blind spot -- not only `ignore_missing_imports = true` but
# equally `follow_imports = "skip"` (both verified to let a typo'd
# `exc.querry` pass clean). If a future engine symbol genuinely can't be
# typed, narrow the override to that one module and say why.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
