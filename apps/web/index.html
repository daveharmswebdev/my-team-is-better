<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap"
    />
    <title>My Team Is Better</title>
    <!--
      Link previews (issue #185). Scrapers don't run JS, so these are static
      and absolute on the production origin. The image is generated by
      scripts/og-image/ (npm run og-image); src/test/socialPreview.test.ts
      checks the tags and the PNG's real size.
    -->
    <meta
      name="description"
      content="Ask whose team is better and the guy at the end of the bar settles it, with the math to back him up."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Team Is Better" />
    <meta property="og:title" content="My Team Is Better" />
    <meta
      property="og:description"
      content="Ask whose team is better and the guy at the end of the bar settles it, with the math to back him up."
    />
    <meta
      property="og:url"
      content="https://my-team-is-better-web.onrender.com/"
    />
    <meta
      property="og:image"
      content="https://my-team-is-better-web.onrender.com/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The words My Team Is Better beside a football on a leather band, for college football and the NFL."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Team Is Better" />
    <meta
      name="twitter:description"
      content="Ask whose team is better and the guy at the end of the bar settles it, with the math to back him up."
    />
    <meta
      name="twitter:image"
      content="https://my-team-is-better-web.onrender.com/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="The words My Team Is Better beside a football on a leather band, for college football and the NFL."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
