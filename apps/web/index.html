<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Self-hosted typefaces (issue #405): no page load waits on a third party.
      Anton (Vernon Adams, The Anton Project Authors) and Barlow / Barlow
      Condensed (Jeremy Tribby, The Barlow Project Authors), SIL Open Font
      License 1.1: public/fonts/OFL.txt. Sources and credits:
      public/fonts/README.md. src/test/selfHostedFonts.test.ts checks every
      face is declared here and its file exists. The preloads are the faces
      the home page paints above the fold: the Anton title, Barlow body text
      and the Barlow Condensed brand (700) and nav (600).
    -->
    <link
      rel="preload"
      href="/fonts/anton-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/barlow-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/barlow-condensed-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/barlow-condensed-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Anton';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/anton-400-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Barlow';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/barlow-400-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;

          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,

        font-family: 'Barlow';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/barlow-600-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;

        font-weight: 700;

        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/barlow-condensed-500-latin.woff2') format('woff2');

      }
    </style>
    <title>My Team Is Better</title>
    <!--
      Link previews (issue #185). Scrapers don't run JS, so these are static
      and absolute on the production origin. The image is generated by
      scripts/og-image/ (npm run og-image); src/test/socialPreview.test.ts
      checks the tags and the PNG's real size.
    -->
    <meta
      name="description"
      content="Ask whose team is better and the guy at the end of the bar settles it, with the math to back him up."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Team Is Better" />
    <meta property="og:title" content="My Team Is Better" />
    <meta
      property="og:description"
      content="Ask whose team is better and the guy at the end of the bar settles it, with the math to back him up."
    />
    <meta
      property="og:url"
      content="https://my-team-is-better-web.onrender.com/"
    />
    <meta
      property="og:image"
      content="https://my-team-is-better-web.onrender.com/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The words My Team Is Better beside a football on a leather band, for college football and the NFL."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Team Is Better" />
    <meta
      name="twitter:description"
      content="Ask whose team is better and the guy at the end of the bar settles it, with the math to back him up."
    />
    <meta
      name="twitter:image"
      content="https://my-team-is-better-web.onrender.com/og-image.png"
    />

      name="twitter:image:alt"
      content="The words My Team Is Better beside a football on a leather band, for college football and the NFL."
    />
