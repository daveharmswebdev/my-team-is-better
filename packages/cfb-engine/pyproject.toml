[project]
name = "cfb-strength-orchestrated"
version = "0.1.0"
description = "Recursive strength-of-schedule college football rankings, exposed via MCP (coordinator/subagent rebuild)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "requests>=2.34.2",
]

[project.scripts]
cfb = "cfb_strength.cli:main"
cfb-mcp-server = "cfb_strength.mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cfb_strength"

[tool.pytest.ini_options]
# Issue #110: `ensure_schema` migrating a db that already holds games means
# the db is stale (#97), so the warning is an error for the whole suite. The
# committed fixtures come from tests/fixtures/build_regression_fixtures.py.
# Only a test that migrates a stale db on purpose may ignore it, narrowly,
# on that test (see test_schema_migration.py) -- never here.
filterwarnings = ["error::cfb_strength.db.connection.StaleDatabaseWarning"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy>=1.14.0",
    "import-linter>=2.1",
    "pre-commit>=4.6.2",
]
