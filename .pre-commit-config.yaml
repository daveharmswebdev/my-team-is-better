repos:
  - repo: local
    hooks:
      - id: cfb-engine-pytest
        name: cfb-engine — pytest
        entry: bash -c 'cd packages/cfb-engine && uv run pytest'
        language: system
        pass_filenames: false
        always_run: true
      - id: cfb-engine-mypy-strict-contracts
        name: cfb-engine — mypy --strict (contracts.py, the interface contract)
        entry: bash -c 'cd packages/cfb-engine && uv run mypy --strict src/cfb_strength/contracts.py'
        language: system
        pass_filenames: false
        always_run: true
      - id: cfb-engine-lint-imports
        name: cfb-engine — import-linter (layered architecture + sibling independence)
        entry: bash -c 'cd packages/cfb-engine && uv run lint-imports'
        language: system
        pass_filenames: false
        always_run: true
      - id: apps-api-pytest
        name: apps/api — pytest
        entry: bash -c 'cd apps/api && uv run pytest'
        language: system
        pass_filenames: false
        always_run: true
      - id: apps-api-mypy-strict
        name: apps/api — mypy --strict
        entry: bash -c 'cd apps/api && uv run mypy --strict src/api tests'
        language: system
        pass_filenames: false
        always_run: true
      - id: apps-api-ruff
        name: apps/api — ruff check + format --check
        entry: bash -c 'cd apps/api && uv run ruff check . && uv run ruff format --check .'
        language: system
        pass_filenames: false
        always_run: true

# apps/web gets its own hooks (eslint/tsc/dependency-cruiser) added here when
# it is scaffolded — see CLAUDE.md "Engineering standards".
