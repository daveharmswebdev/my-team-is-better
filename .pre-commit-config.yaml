repos:
  - repo: local
    hooks:
      - id: cfb-engine-pytest
        name: cfb-engine — pytest
        entry: bash -c 'cd packages/cfb-engine && uv run pytest'
        language: system
        pass_filenames: false
        always_run: true
      - id: cfb-engine-mypy-strict-contracts
        name: cfb-engine — mypy --strict (whole package)
        entry: bash -c 'cd packages/cfb-engine && uv run mypy --strict src/cfb_strength'
        language: system
        pass_filenames: false
        always_run: true
      - id: cfb-engine-lint-imports
        name: cfb-engine — import-linter (layered architecture + sibling independence)
        entry: bash -c 'cd packages/cfb-engine && uv run lint-imports'
        language: system
        pass_filenames: false
        always_run: true
      - id: cfb-engine-ruff
        name: cfb-engine — ruff check + format --check
        entry: bash -c 'cd packages/cfb-engine && uv run ruff check . && uv run ruff format --check .'
        language: system
        pass_filenames: false
        always_run: true
      - id: apps-api-pytest
        name: apps/api — pytest
        entry: bash -c 'cd apps/api && uv run pytest'
        language: system
        pass_filenames: false
        always_run: true
      - id: apps-api-mypy-strict
        name: apps/api — mypy --strict
        entry: bash -c 'cd apps/api && uv run mypy --strict src/api tests'
        language: system
        pass_filenames: false
        always_run: true
      - id: apps-api-ruff
        name: apps/api — ruff check + format --check
        entry: bash -c 'cd apps/api && uv run ruff check . && uv run ruff format --check .'
        language: system
        pass_filenames: false
        always_run: true
      - id: apps-api-lint-imports
        name: apps/api — import-linter (engine layering rule)
        entry: bash -c 'cd apps/api && uv run lint-imports'
        language: system
        pass_filenames: false
        always_run: true
      # apps/web's hooks, promised by a comment here since before #5/#45
      # scaffolded it and added in #55. These mirror the fast static-analysis
      # tier of the `apps-web` CI job only. Vitest and the Storybook build are
      # deliberately CI-only -- both are too slow for a commit hook, and
      # neither is the kind of check a local mirror buys much on.
      #
      # `tsc -b` (build mode), not a plain `tsc --noEmit`: this is a
      # multi-project TypeScript setup -- tsconfig.app.json and
      # tsconfig.node.json behind a solution tsconfig.json with `"files": []`
      # -- so a plain root `tsc --noEmit` compiles zero files and exits 0 even
      # on a real type error (verified). Only build mode follows the references.
      # It is also exactly what CI and `npm run build` run. (`.storybook/` is in
      # neither project, so this hook does not check it -- see #126.)
      - id: apps-web-eslint
        name: apps/web — ESLint (typescript-eslint)
        entry: bash -c 'cd apps/web && npm run lint'
        language: system
        pass_filenames: false
        always_run: true
      - id: apps-web-tsc
        name: apps/web — tsc (type-check)
        entry: bash -c 'cd apps/web && npx tsc -b'
        language: system
        pass_filenames: false
        always_run: true
      - id: apps-web-dep-cruise
        name: apps/web — dependency-cruiser (module boundaries)
        entry: bash -c 'cd apps/web && npm run dep-cruise'
        language: system
        pass_filenames: false
        always_run: true
      # Prettier has a `format:check` script and is listed in CLAUDE.md's
      # standards, but no CI job runs it -- so before #55 nothing checked
      # formatting anywhere. This hook is the first check of it; the CI half is
      # tracked separately rather than smuggled into this issue's config-only
      # scope.
      - id: apps-web-prettier
        name: apps/web — prettier --check
        entry: bash -c 'cd apps/web && npm run format:check'
        language: system
        pass_filenames: false
        always_run: true
      # Mirrors the `claude-process` CI job: the hooks that enforce the
      # coordinator/spoke process (.claude/hooks/).
      - id: claude-process
        name: .claude/hooks — pytest + mypy --strict + ruff
        entry: >-
          bash -c 'uv run --no-project --quiet --python 3.12 --with pytest==9.1.1 --with jsonschema==4.26.0 pytest -q .claude/hooks/tests
          && MYPYPATH=.claude/hooks uv run --no-project --quiet --python 3.12 --with mypy==2.3.1 --with pytest==9.1.1 --with jsonschema==4.26.0 --with types-jsonschema==4.26.0.20260518 mypy --strict --explicit-package-bases .claude/hooks
          && uv run --no-project --quiet --with ruff==0.16.6 ruff check .claude/hooks
          && uv run --no-project --quiet --with ruff==0.16.6 ruff format --check .claude/hooks'
        language: system
        pass_filenames: false
        always_run: true
