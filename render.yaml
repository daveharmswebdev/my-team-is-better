# Render Blueprint -- see docs/ARCHITECTURE.md §7 for the full deployment
# design (static site + web service + Postgres).
#
# This file declares apps/api's web service (issue #2) and apps/web's
# static site (issue #5). The Postgres instance is added here once the
# accounts/persona-cache work lands (issue #4 and beyond) -- don't add it
# speculatively ahead of the code that needs it.
#
# Build command note (docs/ARCHITECTURE.md §3.1): the engine's ingest range
# now matches the product's 1998-2025 target (issue #9) --
# `cfb_strength.ingest.ingest_season`'s MIN_YEAR/MAX_YEAR were extended and
# 1998/1999/2024/2025 were live-fetched from CFBD and committed to
# `packages/cfb-engine/data/raw/` alongside that change, so this build
# command's `--years 1998-2025` is a 100% cache hit, not a live API call.
#
# NFL ingest/rate steps (issue #51's deliberately-deferred gap, see PR #63's
# "Known gap" note): left out of this build command until apps/api's
# /api/teams and persona-grounding check were sport-scoped (#59) and
# apps/web's toggle existed (#56/#60), so landing NFL teams into the live
# db wouldn't leak into the still-CFB-only product's picker. All three are
# merged now. `--years 1999-2025` matches nflverse's MIN_YEAR/MAX_YEAR
# (ingest/nflverse/ingest_season.py) -- 2026 is excluded as in-progress,
# same reasoning as CFB's own current-season exclusion. Cache-first from
# the whole-history CSVs already committed under data/raw/nfl/, so this is
# also a 100% cache hit, not a live fetch (verified locally: ~2.4s total
# for the full cfb+nfl ingest+rate sequence).
services:
  - type: web
    name: my-team-is-better-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: apps/api
    # `apps/api` depends on `packages/cfb-engine` as an editable uv workspace
    # dependency (`cfb-strength-orchestrated = { workspace = true }` in
    # apps/api/pyproject.toml, resolved via `editable = "packages/cfb-engine"`
    # in the root uv.lock) -- this service's runtime behavior is a direct
    # function of that package's source, not just apps/api's own files.
    # Render's default per-service auto-deploy filter only fires on commits
    # touching `rootDir` (apps/api/**), so an engine-only src change (e.g.
    # PR #64's ratings fix) silently never auto-deployed this service --
    # discovered when PR #70 touched packages/cfb-engine and only the web
    # service redeployed. This explicit buildFilter closes that gap.
    buildFilter:
      paths:
        - apps/api/**
        - packages/cfb-engine/**
        - pyproject.toml
        - uv.lock
    # The four `--method elo` / `--method elo_career` legs are what make
    # `?method=elo` return data rather than an empty 200. They ship in the
    # same deploy as the API's `method` Literal deliberately: the Literal
    # promotes `elo` from an invalid value to a valid one, so shipping it
    # first would open a window where a valid method returns an empty list
    # indistinguishable from an un-ingested season.
    #
    # Measured cost of the four added legs against a fully-ingested db:
    # 0.25s (cfb elo) + 1.64s (cfb elo_career) + 0.12s (nfl elo) + 0.56s
    # (nfl elo_career) = 2.58s. `elo_career` is the expensive pair because
    # each target year replays full history from scratch -- O(seasons^2) by
    # design, deliberately not optimized into a single-pass snapshot writer,
    # because that would stop `rate --years 2005 --method elo_career` from
    # being independently correct.
    #
    # Order matters in one respect: every `rate` leg must follow BOTH
    # `ingest` legs, because `elo_career --sport nfl` loads `season <= ?`
    # across the full history rather than a single season.
    #
    # `cfb doctor` runs last (issue #159): it exits non-zero when the db it
    # just built is behind the committed raw cache, a league has no games,
    # a season is unrated under a registered method, or no CFB team has a
    # mascot, so a deploy whose data isn't current fails at build time and
    # the previous deploy keeps serving. It reads the same default DB_PATH
    # the legs above wrote, needs no network, and its per-league year
    # bounds are the ingest MIN_YEAR/MAX_YEAR the `--years` ranges above
    # already match (cfb 1998-2025, nfl 1999-2025). Measured locally on a
    # replay of this exact command: the whole chain plus the doctor takes
    # ~6s and the doctor reports "OK: the db's data is current".
    buildCommand: >-
      uv sync --frozen --no-dev &&
      uv run cfb ingest --years 1998-2025 &&
      uv run cfb ingest --sport nfl --years 1999-2025 &&
      uv run cfb rate --years 1998-2025 &&
      uv run cfb rate --years 1998-2025 --method elo &&
      uv run cfb rate --years 1998-2025 --method elo_career &&
      uv run cfb rate --years 1999-2025 --sport nfl &&
      uv run cfb rate --years 1999-2025 --method elo --sport nfl &&
      uv run cfb rate --years 1999-2025 --method elo_career --sport nfl &&
      uv run cfb doctor
    startCommand: uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    # DATABASE_URL (Postgres) and the auth provider secret are added here
    # once the Postgres instance and accounts work land -- out of scope for
    # this issue (see docs/ARCHITECTURE.md §7, §5).

  - type: web
    name: my-team-is-better-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Vite bakes this into the static build at build time, not runtime --
      # set to the api service's exact live URL (e.g.
      # https://my-team-is-better-api.onrender.com) once known. Without
      # this, apps/web/src/lib/api/client.ts falls back to
      # http://localhost:8000, which would silently break every deployed
      # request.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA fallback: client-side routing owns everything under /.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
